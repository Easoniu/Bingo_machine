<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>賓果機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.92) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-pop-in { animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
    </style>
</head>
<body class="bg-neutral-50 text-neutral-900 h-screen w-screen flex flex-col items-center justify-center overflow-hidden p-3 sm:p-4">

    <div id="main-container" class="max-w-md w-full bg-white border border-neutral-200 rounded-2xl shadow-sm p-4 sm:p-6 transition-all duration-300 flex flex-col box-border">
        
        <h1 class="text-xl font-semibold tracking-tight text-center mb-1 text-neutral-800">賓果機</h1>
        <p class="text-center text-xs text-neutral-500 mb-4">Vercel + Fish Audio 雲端串流版</p>

        <div id="home-view" class="space-y-6 animate-fade-in">
            <div id="host-section" class="space-y-3">
                <button type="button" onclick="goToSettings()" class="w-full bg-neutral-900 text-white font-medium text-sm py-3 rounded-lg hover:bg-neutral-800 active:scale-[0.98] transition shadow-sm">
                    建立頻道
                </button>
            </div>
            
            <div id="divider-section" class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-neutral-200"></div>
                <span class="flex-shrink mx-3 text-neutral-400 text-xs">或</span>
                <div class="flex-grow border-t border-neutral-200"></div>
            </div>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-neutral-500 mb-1.5 uppercase tracking-wider">你的暱稱</label>
                    <input type="text" id="username" class="w-full bg-neutral-50 border border-neutral-200 rounded-lg px-3.5 py-2.5 text-sm outline-none" placeholder="例如：67小孩">
                </div>
                <div>
                    <label class="block text-xs font-medium text-neutral-500 mb-1.5 uppercase tracking-wider">頻道代碼</label>
                    <input type="text" id="room-code-input" class="w-full bg-neutral-50 border border-neutral-200 rounded-lg px-3.5 py-2.5 text-sm uppercase tracking-wider outline-none" placeholder="輸入 4 碼代碼">
                </div>
                <button type="button" id="join-btn" onclick="joinRoom()" class="w-full bg-white border border-neutral-300 text-neutral-700 font-medium text-sm py-3 rounded-lg hover:bg-neutral-50 active:scale-[0.98] transition">
                    加入頻道
                </button>
            </div>
        </div>

        <div id="settings-view" class="hidden space-y-4 animate-fade-in">
            <h2 class="text-sm font-semibold text-neutral-700 uppercase tracking-wider border-b pb-2">⚙️ 頻道詳細設定</h2>
            <div>
                <label class="block text-xs font-medium text-neutral-500 mb-1.5 uppercase tracking-wider">頻道名稱</label>
                <input type="text" id="room-title-input" placeholder="例如：賓果派對" class="w-full bg-neutral-50 border border-neutral-200 rounded-lg px-3.5 py-2.5 text-sm outline-none">
            </div>
            <div class="pt-3 flex gap-2">
                <button type="button" onclick="backToHome()" class="w-1/3 bg-neutral-100 text-neutral-600 font-medium text-sm py-2.5 rounded-lg">返回</button>
                <button type="button" onclick="createRoom()" class="w-2/3 bg-neutral-900 text-white font-medium text-sm py-2.5 rounded-lg">確認建立頻道</button>
            </div>
        </div>

        <div id="game-view" class="hidden flex-1 flex flex-col space-y-3 animate-fade-in overflow-hidden">
            <div class="flex justify-between items-center bg-neutral-50 border border-neutral-200 p-3 rounded-lg text-sm shrink-0">
                <div>
                    <span id="display-room-title" class="font-bold text-neutral-900 text-base block">房間名稱</span>
                    <span class="text-xs text-neutral-400">頻道代碼: <span id="display-room-code" class="font-mono font-semibold">----</span></span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-neutral-400 block">身份</span>
                    <span id="display-role-name" class="font-medium text-neutral-900">--</span>
                </div>
            </div>

            <div id="host-view" class="hidden flex-1 flex flex-col space-y-3 overflow-hidden">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-3 flex-1 overflow-hidden">
                    <div class="lg:col-span-5 flex flex-col space-y-3 overflow-hidden">
                        <div class="bg-white border border-neutral-200 p-3 rounded-xl text-center space-y-1.5 shadow-sm shrink-0">
                            <span class="text-xs font-semibold text-neutral-500 uppercase tracking-wider block">掃描 QR Code 加入</span>
                            <div id="qrcode-container" class="flex justify-center p-1 bg-white inline-block"></div>
                        </div>
                        <div class="bg-neutral-900 text-white p-3.5 rounded-xl space-y-2 shrink-0">
                            <span class="text-xs text-neutral-400 uppercase tracking-wider">線上玩家 (<span id="player-count">0</span>)</span>
                            <div id="player-list" class="text-xs text-neutral-300 flex flex-wrap gap-1.5 max-h-36 overflow-y-auto"></div>
                        </div>
                    </div>
                    <div class="lg:col-span-7 flex flex-col space-y-3 overflow-hidden">
                        <div class="bg-neutral-50 border border-neutral-200 p-3 rounded-xl text-center shrink-0">
                            <span class="text-xs text-neutral-400 uppercase tracking-wider block mb-0.5">目前狀態</span>
                            <div id="host-turn-status" class="text-sm font-medium text-neutral-700">等待開始抽籤...</div>
                        </div>
                        <div class="bg-neutral-50 border border-neutral-200 p-3 rounded-xl text-center shrink-0">
                            <span class="text-xs text-neutral-400 uppercase tracking-wider block mb-0.5">最新選號結果</span>
                            <div id="host-latest-result" class="text-xl font-bold tracking-tight text-neutral-900">尚未選出數字</div>
                        </div>
                    </div>
                </div>

                <div class="bg-white border border-neutral-200 p-2.5 rounded-xl flex flex-wrap gap-2 items-center justify-center shrink-0">
                    <button type="button" onclick="pickRandomPlayer()" class="bg-neutral-900 text-white text-xs font-medium px-3.5 py-2 rounded-lg">抽取玩家</button>
                    <button type="button" onclick="resetRoomGame()" class="bg-amber-50 text-amber-700 text-xs font-medium px-3.5 py-2 rounded-lg">重新開始</button>
                    <button type="button" onclick="closeRoom()" class="bg-red-50 text-red-600 text-xs font-medium px-3.5 py-2 rounded-lg">關閉頻道</button>
                </div>
            </div>

            <div id="player-view" class="hidden space-y-3 px-1 box-border">
                <div id="turn-banner" class="bg-neutral-100 border border-neutral-200 text-neutral-700 text-center font-medium text-sm py-2.5 rounded-lg">
                    等待主機抽籤中...
                </div>
                <div class="grid grid-cols-5 gap-2 text-center" id="bingo-board"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDyXjsT4um5kS-EOKZvWELmMAUiAMC3Aaw",
            authDomain: "crazyplay-party-bingo.firebaseapp.com",
            databaseURL: "https://crazyplay-party-bingo-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "crazyplay-party-bingo",
            storageBucket: "crazyplay-party-bingo.firebasestorage.app",
            messagingSenderId: "36025938450",
            appId: "1:36025938450:web:a301f422589ecddc3a5ecb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRoom = null;
        let myName = "";
        let myId = 'user_' + Math.random().toString(36).substring(2, 9);
        let isHost = false;
        let maxNum = 75;
        let roomTitle = "賓果派對";
        let boardNumbers = [];
        let markedCells = Array(25).fill(false);
        let currentTurnPlayerId = null;
        let allPlayers = {};
        
        let announcementQueue = [];
        let isProcessingQueue = false;
        let audioCache = {}; // 存放快取音訊 (包含 Fish Audio 生成的玩家名稱與預錄數字)

        // 預先載入固定提示音與數字音檔
        function preloadAudioCache() {
            const files = ['prompt_turn.mp3', 'prompt_selected.mp3', 'number_10.mp3'];
            for (let i = 1; i <= 10; i++) files.push(`number_${i}.mp3`);
            files.forEach(file => {
                audioCache[file] = new Audio(`audio/${file}`);
            });
        }

        // 🚀 當玩家加入時，透過 Vercel 後端向 Fish Audio 請求專屬名稱語音並快取
        async function cachePlayerNameAudio(playerName) {
            if (audioCache[`player_${playerName}`]) return;
            try {
                const res = await fetch(`/api/generate-audio?name=${encodeURIComponent(playerName)}`);
                if (res.ok) {
                    const blob = await res.blob();
                    const audioUrl = URL.createObjectURL(blob);
                    audioCache[`player_${playerName}`] = new Audio(audioUrl);
                }
            } catch (e) {
                console.error("無法載入 Fish Audio 玩家名稱語音", e);
            }
        }

        function speakAnnouncement(type, data) {
            if (!isHost) return;
            announcementQueue.push({ type, data });
            if (!isProcessingQueue) processAnnouncementQueue();
        }

        async function processAnnouncementQueue() {
            if (announcementQueue.length === 0) {
                isProcessingQueue = false;
                return;
            }
            isProcessingQueue = true;
            const item = announcementQueue.shift();

            try {
                if (item.type === 'turn') {
                    await playAudioCached(`player_${item.data.playerName}`);
                    await playAudioCached('prompt_turn.mp3');
                } else if (item.type === 'call') {
                    await playAudioCached(`player_${item.data.playerName}`);
                    await playAudioCached('prompt_selected.mp3');
                    let numFiles = getNumberAudioSequence(item.data.number);
                    for (let file of numFiles) {
                        await playAudioCached(file);
                    }
                }
            } catch (e) {
                console.error("播放序列錯誤", e);
            }
            processAnnouncementQueue();
        }

        function getNumberAudioSequence(num) {
            let files = [];
            if (num <= 10) {
                files.push(`number_${num}.mp3`);
            } else if (num < 20) {
                files.push(`number_10.mp3`);
                let unit = num % 10;
                if (unit > 0) files.push(`number_${unit}.mp3`);
            } else {
                let tens = Math.floor(num / 10);
                let unit = num % 10;
                files.push(`number_${tens}.mp3`);
                files.push(`number_10.mp3`);
                if (unit > 0) files.push(`number_${unit}.mp3`);
            }
            return files;
        }

        function playAudioCached(key) {
            return new Promise((resolve) => {
                let audio = audioCache[key];
                if (!audio) {
                    resolve(); // 若名稱音檔尚未生成完畢則略過，確保流程不卡住
                    return;
                }
                audio.currentTime = 0;
                audio.onended = resolve;
                audio.onerror = resolve;
                audio.play().catch(resolve);
            });
        }

        window.onload = function() {
            preloadAudioCache();
        };

        function generateNumbers(max) {
            let nums = [];
            while(nums.length < 25) {
                let r = Math.floor(Math.random() * max) + 1;
                if(!nums.includes(r)) nums.push(r);
            }
            return nums;
        }

        function goToSettings() {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('settings-view').classList.remove('hidden');
        }

        function backToHome() {
            document.getElementById('settings-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
        }

        function createRoom() {
            roomTitle = document.getElementById('room-title-input').value.trim() || "賓果派對";
            isHost = true;
            currentRoom = Math.random().toString(36).substring(2, 6).toUpperCase();

            db.ref('rooms/' + currentRoom).set({
                roomTitle: roomTitle,
                maxNum: 75,
                currentTurn: null,
                latestCall: null,
                calledNumbers: {}
            }).then(() => {
                db.ref('rooms/' + currentRoom).onDisconnect().remove();
                enterGameView();
            });
        }

        function joinRoom() {
            myName = document.getElementById('username').value.trim();
            const code = document.getElementById('room-code-input').value.trim().toUpperCase();

            if(!myName || !code) { alert('請填寫暱稱與房號'); return; }

            db.ref('rooms/' + code).once('value').then((snapshot) => {
                if(snapshot.exists()) {
                    isHost = false;
                    currentRoom = code;
                    roomTitle = snapshot.val().roomTitle || "賓果派對";
                    boardNumbers = generateNumbers(75);
                    markedCells = Array(25).fill(false);

                    db.ref(`rooms/${currentRoom}/players/${myId}`).set({ name: myName, pickCount: 0 });
                    db.ref(`rooms/${currentRoom}/players/${myId}`).onDisconnect().remove();

                    enterGameView();
                } else {
                    alert('找不到此房間');
                }
            });
        }

        function enterGameView() {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('settings-view').classList.add('hidden');
            document.getElementById('game-view').classList.remove('hidden');
            
            if(isHost) {
                document.getElementById('main-container').classList.remove('max-w-md');
                document.getElementById('main-container').classList.add('max-w-6xl', 'h-[95vh]');
                document.getElementById('host-view').classList.remove('hidden');
                generateQRCode();
            } else {
                document.getElementById('player-view').classList.remove('hidden');
                renderBoard();
            }
            listenGameData();
        }

        function generateQRCode() {
            document.getElementById('qrcode-container').innerHTML = "";
            new QRCode(document.getElementById('qrcode-container'), {
                text: window.location.origin + window.location.pathname + "?room=" + currentRoom,
                width: 120, height: 120
            });
        }

        function renderBoard() {
            const boardEl = document.getElementById('bingo-board');
            boardEl.innerHTML = '';
            boardNumbers.forEach((num, index) => {
                const cell = document.createElement('div');
                const isMarked = markedCells[index];
                cell.className = `aspect-square flex items-center justify-center font-semibold text-base rounded-lg ${isMarked ? 'bg-neutral-900 text-white' : 'bg-neutral-100 text-neutral-800'}`;
                if(currentTurnPlayerId === myId && !isMarked) {
                    cell.className += ' cursor-pointer ring-2 ring-neutral-900 animate-pulse';
                    cell.onclick = () => {
                        db.ref(`rooms/${currentRoom}/calledNumbers/${num}`).set(true);
                        db.ref(`rooms/${currentRoom}/latestCall`).set({ playerName: myName, number: num });
                        db.ref(`rooms/${currentRoom}/currentTurn`).set(null);
                    };
                }
                cell.innerText = num;
                boardEl.appendChild(cell);
            });
        }

        function pickRandomPlayer() {
            const playerIds = Object.keys(allPlayers);
            if(playerIds.length === 0) return;
            const randomId = playerIds[Math.floor(Math.random() * playerIds.length)];
            db.ref(`rooms/${currentRoom}/currentTurn`).set({
                playerId: randomId,
                playerName: allPlayers[randomId].name
            });
        }

        let lastTurnId = null;
        let lastCallKey = null;

        function listenGameData() {
            db.ref(`rooms/${currentRoom}/players`).on('value', (snapshot) => {
                allPlayers = snapshot.val() || {};
                const listEl = document.getElementById('player-list');
                const countEl = document.getElementById('player-count');
                listEl.innerHTML = '';
                let count = 0;
                for(let id in allPlayers) {
                    count++;
                    const pName = allPlayers[id].name;
                    listEl.innerHTML += `<span class="bg-neutral-800 px-2 py-0.5 rounded text-neutral-200">${pName}</span>`;
                    
                    // 🎯 玩家加入時，自動觸發 Vercel 後端生成該名稱的 Fish Audio 語音
                    if (isHost) {
                        cachePlayerNameAudio(pName);
                    }
                }
                countEl.innerText = count;
            });

            db.ref(`rooms/${currentRoom}/currentTurn`).on('value', (snapshot) => {
                const turn = snapshot.val();
                currentTurnPlayerId = turn ? turn.playerId : null;
                if (turn && turn.playerId !== lastTurnId) {
                    lastTurnId = turn.playerId;
                    speakAnnouncement('turn', turn);
                } else if (!turn) {
                    lastTurnId = null;
                }
            });

            db.ref(`rooms/${currentRoom}/latestCall`).on('value', (snapshot) => {
                const latest = snapshot.val();
                if (latest) {
                    const callKey = `${latest.playerName}_${latest.number}`;
                    if (callKey !== lastCallKey) {
                        lastCallKey = callKey;
                        speakAnnouncement('call', latest);
                    }
                }
            });

            db.ref(`rooms/${currentRoom}/calledNumbers`).on('value', (snapshot) => {
                calledNumbers = snapshot.val() || {};
                boardNumbers.forEach((num, index) => {
                    markedCells[index] = !!calledNumbers[num];
                });
                renderBoard();
            });
        }

        function resetRoomGame() { db.ref('rooms/' + currentRoom).update({ currentTurn: null, latestCall: null, calledNumbers: null }); }
        function closeRoom() { db.ref('rooms/' + currentRoom).remove().then(() => location.reload()); }
    </script>
</body>
</html>
